name: Build Beta APK

on:
  push:
    branches:
      - "main"
    tags-ignore:
      - "*.*.*" # Bỏ qua khi có tag (để tránh trùng stable build)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Lấy code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # 2️⃣ Cài JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Cấp quyền chạy gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4️⃣ Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 5️⃣ Ký APK (giống stable)
      - name: Sign Debug APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      # 6️⃣ Đổi tên file APK sau khi ký
      - name: Rename Signed APK
        run: |
          cd app/build/outputs/apk/debug
          echo "==> Files in debug folder:"
          ls -al
          APK_FILE=$(ls *-signed.apk | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Không tìm thấy file APK nào sau khi ký!"
            exit 1
          fi
          NEW_NAME="doki-beta-$(head /dev/urandom | tr -dc a-z0-9 | head -c 6).apk"
          mv "$APK_FILE" "$NEW_NAME"
          echo "✅ Đã đổi tên $APK_FILE → $NEW_NAME"
          echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV

      # 7️⃣ Xóa bản beta cũ (nếu có)
      - name: Delete old beta release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --yes || true

      # 8️⃣ Tạo bản beta mới
      - name: Create new beta release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd app/build/outputs/apk/debug
          # Extract version from build.gradle (handles both single and double quotes)
          VERSION=$(grep 'versionName = ' ../../../../app/build.gradle | sed -n "s/.*versionName = ['\"]\\([^'\"]*\\)['\"].*/\\1/p")
          if [ -z "$VERSION" ]; then
            echo "❌ Could not extract version from build.gradle"
            exit 1
          fi
          COMMIT=$(git rev-parse --short HEAD)
          echo "✅ Extracted version: ${VERSION}"
          gh release create beta "$APK_NAME" \
            --title "Beta Release ${VERSION}" \
            --notes "🧪 Bản thử nghiệm mới nhất (beta)\nVersion: ${VERSION}\nCommit: ${COMMIT}\nBranch: main" \
            --prerelease
